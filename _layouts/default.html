<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body class="{{ page.body_class }}">

<header class="site-header">
  <div class="container">

    <div class="site-title">
      <a href="{{ '/' | relative_url }}">Abdul Quadir</a>
    </div>
    
    <nav class="navigation">

      <a
        href="{{ '/' | relative_url }}"
        class="{% if page.url == '/' %}active{% endif %}">
        Home
      </a>

      <a
        href="{{ '/research/' | relative_url }}"
        class="{% if page.url == '/research/' %}active{% endif %}">
        Research & Education
      </a>

      <a
        href="{{ '/publications/' | relative_url }}"
        class="{% if page.url == '/publications/' %}active{% endif %}">
        Publications
      </a>
      
      <a
        href="{{ '/coauthors/' | relative_url }}"
        class="{% if page.url == '/coauthors/' %}active{% endif %}">
        Research Co-authors
      </a>

      <a
        href="{{ '/awards/' | relative_url }}"
        class="{% if page.url == '/awards/' %}active{% endif %}">
        Honours & Awards
      </a>

      <a
        href="{{ '/links/' | relative_url }}"
        class="{% if page.url == '/links/' %}active{% endif %}">
        Links
      </a>

      <a
        href="{{ '/cv/' | relative_url }}"
        class="{% if page.url == '/cv/' %}active{% endif %}">
        CV
      </a>

      <a
        href="{{ '/activity/' | relative_url }}"
        class="{% if page.url == '/activity/' %}active{% endif %}">
        Activity
      </a>

      <a
        href="{{ '/posts/' | relative_url }}"
        class="{% if page.url == '/posts/' %}active{% endif %}">
        Posts
      </a>

    </nav>

  </div>
</header>

<main class="container">
  {{ content }}
</main>

<footer>
  <div class="container">
    <p>© {{ "now" | date: "%Y" }} Abdul Quadir</p>
  </div>
</footer>

</body>
</html>
